<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .small { display: none }
    /* Hairline rings vanish when rasterized small: thicken them on launcher-sized icons
       and draw fewer, bolder ones for favicons. */
    @media (max-width: 128px) {
      .large { stroke-width: 11px }
    }
    @media (max-width: 40px) {
      .large { display: none }
      .small { display: inline }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="256" cy="256" r="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a5046"/>
      <stop offset="0.7" stop-color="#1a352e"/>
      <stop offset="1" stop-color="#10231f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g class="large" fill="none" stroke-width="5.6">
    <circle cx="256" cy="256" r="221.6" stroke="#566057"/>
    <circle cx="256" cy="256" r="157.6" stroke="#8c8677"/>
    <circle cx="256" cy="256" r="93.6" stroke="#cfac99"/>
  </g>
  <circle class="large" cx="256" cy="256" r="50" fill="#b84b2c"/>
  <g class="small" fill="none">
    <circle cx="256" cy="256" r="196" stroke="#8c8677" stroke-width="30"/>
    <circle cx="256" cy="256" r="128" stroke="#cfac99" stroke-width="32"/>
  </g>
  <circle class="small" cx="256" cy="256" r="70" fill="#b84b2c"/>
</svg>
