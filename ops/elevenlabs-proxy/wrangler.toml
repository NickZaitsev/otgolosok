name = "otgolosok-elevenlabs-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "elevenlabs-proxy.otgolosok.online", custom_domain = true }]

[vars]
# Comma-separated; a request from any other address gets 403.
# production-VPS — production generator VPS (Beget); VPN-IP — developer's VPN exit (Datacamp NL), shared with other VPN users.
ALLOWED_IPS = "production-VPS,VPN-IP"
