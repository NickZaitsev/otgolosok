# Shared by every /api/ location. Each location still sets its own
# Cache-Control and includes security-headers.conf (add_header is not inherited).
access_log /var/log/nginx/access.log api_private;
# Docker DNS is re-resolved when the backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:3000;
proxy_pass $backend$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Origin $http_origin;
proxy_set_header Authorization $http_authorization;
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
# Better Auth rate limiting reads only the value overwritten by this proxy.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_read_timeout 660s;
proxy_send_timeout 660s;
proxy_buffering off;
proxy_cache off;
