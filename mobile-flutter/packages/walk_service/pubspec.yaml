name: walk_service
description: "Служба прогулки Отголоска: геолокация, плеер и карточка на экране блокировки при выключенном экране."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  pigeon: 29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: online.otgolosok.walk_service
        pluginClass: WalkServicePlugin
