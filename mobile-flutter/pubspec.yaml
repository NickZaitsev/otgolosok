name: otgolosok
description: "Отголосок — аудиогид, который включает рассказ, когда вы дошли до места."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cookie_jar: 4.0.9
  crypto: 3.0.7
  dio: 5.11.1
  dio_cookie_manager: 3.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  go_router: 18.1.1
  maplibre_gl: 0.27.1
  path_provider: 2.1.6
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  walk_service:
    path: packages/walk_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  pigeon: 29.0.11

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/i18n/app/
    - assets/map/
    - assets/map/icons/

